<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Music</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1f1f23">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root {
    --bg: #141416; --panel: #1f1f23; --hi: #3a3a42; --lo: #0a0a0c; --text: #ffffff; --muted: #a8a8b3; --accent: #5ee05a;
    --stone: #8b8b8b; --stone-hi: #c6c6c6; --stone-lo: #555555;
    --px: 'Press Start 2P', 'Courier New', monospace;
    color-scheme: dark; box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; color: var(--text); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  html { background-color: #2f2a27; background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAIAAACQkWg2AAAClElEQVR4nE3SW08TQQCG4W9m2m27bdJCgyHFxENUQClNUFDU5cbopSERxQv/qAGjFxojYDSRkFhbitkexO22e5xlZ7szXniI79XzA16ycOVSIZ/D3xhjAJRSUsrf/r/ACzLFov5wfrZIJBEJNA0g45gTQAEACFDRCo6IKjk9VHh51KUAprTMx9aJzE4OWh2J8PTH+FK5OBr6i+emh7Y3laf9njVbzle0DACqpIxCHvJ0mmXPeFqlbOiGEKJvu7Hv9IZ+IhIrSELXT0LOFKGE0kAlRr222zTv1mv7prtlNHab5lOjsdPsG/W5vba5uXZt//tPaFkwQmWaAqiybCRQLZQGrg9gxOM4PouErBZK9llqR0HX9ZyYSykpZWymVN4zR49Xru63B1vrS2+POg/qF3YP2/cWa++OjrfuLB33/RfGykypTBmlSKXgYd/2k1j0hh73wv7Qm2YZzidVxiw/Cf2wa/uB6ychJxNFwaimF7eN5c9de3uj8aFl3l8+f2A6WxuN953h5u35g5Mfz436556dLeopFE3T1ArcvmN37HHfsZ2JqhZKA9cbjIem69lRYHkhUeiMRlbgKgLKGCvn9KY5era2eDxwn6xe3zls3V+sfWqfPqhfbJr249Vrr7+0nt26UcnpRIGSVEqRWE5ERNyzQt/3Aj6ZYlkeTaqM2U4EkZy6YSJEKhJKCFWM5ov6U2N5rzva3lh68818bjReNc17S3M7ze56/fxu09xcW9hrd/NFHYxQpZQVuLHv/vTPAIiUAhhzUSvPREJVC6URF3YU9ILYCjylQG42bjyan00E//3bTKkMwArcf6jkClpGUwSOmOx8HZCFyxdLug6AKEgKBWQkJhRU/VlaEkgpKaVEQUL+ApRwisXDrGaiAAAAAElFTkSuQmCC"); background-size: 192px 192px; background-attachment: fixed; image-rendering: pixelated; } /* block size: change 192px */
  body { background: transparent; }
  body::before { content: ""; position: fixed; inset: 0; background: rgba(10,10,18,.3); z-index: 0;   /* light dimming: raise .3 for a darker backdrop */ pointer-events: none; }
  .app { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; padding: 22px 16px 40px; display: grid; gap: 22px; grid-template-columns: 1fr; }
  @media (min-width: 800px) { .app { grid-template-columns: 370px 1fr; align-items: start; } .now { position: sticky; top: 22px; } }
  h2 { font: 10px/1.6 var(--px); margin: 0 0 14px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }

  /* Panels: dark stone with a bevel, like the game menus */
  .now, .list { background: var(--panel); border: 4px solid #000; padding: 22px;
                box-shadow: inset 3px 3px 0 var(--hi), inset -3px -3px 0 var(--lo), 6px 6px 0 rgba(0,0,0,.45); }

  /* Cover with a pixel frame; the note block sits in its corner while music plays */
  .coverwrap { position: relative; }
  .cover { width: 100%; aspect-ratio: 1; border: 4px solid #000; display: grid; place-items: center; font: 80px var(--px);
           background-size: cover; background-position: center; color: rgba(255,255,255,.85);
           box-shadow: inset 3px 3px 0 rgba(255,255,255,.18), inset -3px -3px 0 rgba(0,0,0,.35); }
  #nb { position: absolute; right: 10px; bottom: 10px; height: 38%; image-rendering: pixelated; pointer-events: none;
        opacity: 0; transform: translateY(14px) scale(.6); transform-origin: bottom center;
        transition: opacity .35s, transform .35s cubic-bezier(.2, 1.4, .4, 1); filter: drop-shadow(0 6px 8px rgba(0,0,0,.5)); }
  .now.playing #nb { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { #nb { transition: none; } }

  /* Allay: follows the cursor while music plays */
  #allay { position: fixed; left: 0; top: 0; width: 120px; height: auto; z-index: 50; pointer-events: none; opacity: 0;
           transition: opacity .4s; will-change: transform; filter: drop-shadow(0 6px 6px rgba(0,0,0,.4)); }
  #allay.on { opacity: 1; }
  .meta { margin: 20px 0 14px; }
  #title { font: 14px/1.5 var(--px); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 2px 2px 0 #000; }
  #artist { margin: 6px 0 0; color: var(--muted); font-size: 14px; }

  /* Progress and volume: like the experience bar */
  .seek { display: grid; grid-template-columns: 42px 1fr 42px; gap: 10px; align-items: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .seek span:last-child { text-align: right; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; cursor: pointer; outline: none; border: 3px solid #000;
    background-color: #2b2b30; box-shadow: inset 0 3px 0 rgba(0,0,0,.5), 0 0 0 3px #4a4a52;
    background-image: repeating-linear-gradient(90deg, transparent 0 10px, rgba(0,0,0,.28) 10px 12px), linear-gradient(#8dff5a, #3fbf2a);
    background-size: auto, var(--fill, 0%) 100%; background-repeat: no-repeat; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 8px; height: 12px; background: #fff; border: 0; }
  input[type=range]::-moz-range-thumb { width: 8px; height: 12px; background: #fff; border: 0; border-radius: 0; }
  input[type=range]:focus-visible { box-shadow: inset 0 3px 0 rgba(0,0,0,.5), 0 0 0 3px var(--accent); }

  /* Stone buttons */
  .controls { display: flex; justify-content: center; align-items: center; gap: 12px; margin: 20px 0 18px; }
  .btn { font: 18px/1 system-ui, sans-serif; width: 46px; height: 46px; cursor: pointer; color: #fff; background: var(--stone); border: 3px solid #000;
         box-shadow: inset 3px 3px 0 var(--stone-hi), inset -3px -3px 0 var(--stone-lo); text-shadow: 2px 2px 0 #3f3f3f; display: grid; place-items: center; padding: 0; }
  .btn:hover { background: #9a9ea8; }
  .btn:active { box-shadow: inset 3px 3px 0 var(--stone-lo), inset -3px -3px 0 var(--stone-hi); }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .btn.on { background: #5d9b3a; box-shadow: inset 3px 3px 0 #8fd45a, inset -3px -3px 0 #2f5a1c; }
  .play { width: 64px; height: 64px; font-size: 24px; background: #5d9b3a; box-shadow: inset 3px 3px 0 #8fd45a, inset -3px -3px 0 #2f5a1c; }
  .play:hover { background: #6fb347; }
  .play:active { box-shadow: inset 3px 3px 0 #2f5a1c, inset -3px -3px 0 #8fd45a; }
  .vol { display: grid; grid-template-columns: 24px 1fr; gap: 12px; align-items: center; color: var(--muted); font-size: 16px; }

  /* Library */
  #q { width: 100%; padding: 11px 12px; margin-bottom: 14px; color: #fff; background: #0e0e10; border: 3px solid #000; font-size: 14px; outline: none;
       box-shadow: inset 3px 3px 0 #000, inset -3px -3px 0 var(--hi); }
  #q:focus { border-color: var(--accent); }
  /* The track list scrolls inside the Library panel, so the page does not grow with every new song */
  ol { list-style: none; margin: 0; padding: 0 6px 0 0; display: grid; gap: 4px; align-content: start; position: relative;
       max-height: min(62vh, 560px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: #8b8b8b #0e0e10; }
  ol::-webkit-scrollbar { width: 14px; }
  ol::-webkit-scrollbar-track { background: #0e0e10; box-shadow: inset 2px 2px 0 #000; }
  ol::-webkit-scrollbar-thumb { background: #8b8b8b; border: 2px solid #000; box-shadow: inset 2px 2px 0 #c6c6c6, inset -2px -2px 0 #555; }
  li { display: grid; grid-template-columns: 26px 48px 1fr auto; gap: 12px; align-items: center; padding: 8px 10px; cursor: pointer; }
  li.hide { display: none; }
  li:hover { background: #2b2b31; }
  li.active { background: #2b2b31; box-shadow: inset 4px 0 0 var(--accent); }
  li.active .t { color: var(--accent); }
  li .n { color: var(--muted); text-align: center; font: 9px var(--px); }
  li .mini { width: 48px; height: 48px; border: 3px solid #000; display: grid; place-items: center; font: 16px var(--px); background-size: cover; background-position: center; color: rgba(255,255,255,.85); }
  li .t { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li .a { font-size: 13px; color: var(--muted); }
  li .d { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .empty { display: none; color: var(--muted); font-size: 13px; padding: 8px 4px; }
  .hint { margin: 16px 0 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
</style>
</head>

  let clickCtx, clickBuf = null, clickStart = 0;
  function clickInit() {
    if (clickCtx) return;
    try {
      clickCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
      const bin = atob(CLICK_B64), bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      clickCtx.decodeAudioData(bytes.buffer, b => {
        clickBuf = b;
        const d = b.getChannelData(0); let i = 0;   // skip any silence at the start of the file
        while (i < d.length && Math.abs(d[i]) < 0.01) i++;
        clickStart = Math.max(0, i / b.sampleRate - 0.002);
      }, () => {});
    } catch (e) {}
  }
  function blip() {
    clickInit();
    if (!clickCtx) return;
    clickCtx.resume();
    if (!clickBuf) return;
    const src = clickCtx.createBufferSource(), gn = clickCtx.createGain();
    src.buffer = clickBuf; gn.gain.value = CLICK_VOLUME;
    src.connect(gn).connect(clickCtx.destination); src.start(0, clickStart);
  }
  clickInit();
  // The sound plays the moment you press (not when you release). On touch screens, track rows play it on tap
  // instead, so scrolling the list stays silent.
  let lastPointer = 'mouse';
  document.addEventListener('pointerdown', e => {
    lastPointer = e.pointerType;
    if (e.target.closest('.btn') || (e.pointerType === 'mouse' && e.target.closest('li'))) blip();
  }, true);
  document.addEventListener('click', e => { if (lastPointer !== 'mouse' && e.detail && e.target.closest('li')) blip(); }, true);

  // ---------- Search ----------
  $('q').addEventListener('input', e => {
    const v = e.target.value.trim().toLowerCase(); let shown = 0;
    TRACKS.forEach(t => { const ok = !v || (t.title + ' ' + t.artist).toLowerCase().includes(v); t.li.classList.toggle('hide', !ok); if (ok) shown++; });
    $('empty').style.display = shown ? 'none' : 'block';
  });

  // ---------- Installable app (works on GitHub Pages) ----------
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});

  // ---------- Allay: lazily follows the cursor (or your last tap) while music plays ----------
  (function () {
    const el = $('allay');
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { el.remove(); return; }
    const SPEED = 8;                     // follow speed: smaller = lazier, bigger = sticks to the cursor
    let tx = innerWidth * 0.5, ty = innerHeight * 0.35, x = tx, y = ty, flip = 1, raf = 0, hideTimer = 0, placed = false, last = 0;
    const aim = e => { tx = e.clientX; ty = e.clientY; };
    addEventListener('pointermove', aim, { passive: true });
    addEventListener('pointerdown', aim, { passive: true });
    function loop(now) {
      const px = tx + 50 - el.offsetWidth / 2, py = ty - 55 - el.offsetHeight / 2;   // hovers above and to the right of the cursor
      if (!placed) { x = px; y = py; placed = true; }
      const dx = px - x;
      const dt = last ? Math.min((now - last) / 1000, 0.05) : 0.016; last = now;
      const k = 1 - Math.exp(-SPEED * dt);                     // same feel on 60 Hz and 144 Hz screens
      x += dx * k; y += (py - y) * k;
      if (dx > 8) flip = 1; else if (dx < -8) flip = -1;       // turns to face the way it flies
      el.style.transform = `translate3d(${x}px, ${y}px, 0) scaleX(${flip})`;
      raf = requestAnimationFrame(loop);
    }
    audio.addEventListener('play', () => {
      clearTimeout(hideTimer); el.classList.add('on');
      if (!raf) { last = 0; raf = requestAnimationFrame(loop); }
    });
    audio.addEventListener('pause', () => {
      el.classList.remove('on');
      hideTimer = setTimeout(() => { cancelAnimationFrame(raf); raf = 0; }, 500);   // stop moving once it has faded
    });
  })();

  // ---------- Start ----------
  $('vol').value = store.get('mp_vol', 80); audio.volume = $('vol').value / 100; setFill($('vol'));
  renderList(); load(store.get('mp_idx', 0) < TRACKS.length ? store.get('mp_idx', 0) : 0, false);
